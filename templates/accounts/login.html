{% extends "base.html" %}
{% load static %}
{% block title %}Sign in · FileFlow{% endblock %}
{% block login_content %}
<section class="card login-card">
  <div class="brand"><img src="{% static 'img/logo.png' %}" alt="Logo" width="40" height="40">
    <span style="font-size:18px;font-weight:600">File Management System </span></div>
  <h1 style="font-size:22px;margin:0 0 5px">Welcome back</h1>
  <p class="muted" style="margin:0 0 22px">Sign in to manage official correspondence.</p>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit" style="width:100%">Sign in</button></form>
</section>
{% endblock %}
